# 行動工具箱
# 收錄「必須用指令才能拿到」的操作員物品，以及創造模式做不到的強化裝備。
# 自然方塊（尖嘯體、可疑沙、紫水晶母岩那類）不放這裡。
# 開啟方式：/toolbox 或 /tb　權限：serverpanel.toolbox
# 指令一律寫 minecraft:give / minecraft:effect / minecraft:gamemode：EssentialsX 會接管同名的
# 原版指令，它的 /give 看不懂 [enchantments=...] 這類物品組件，會整個失敗但選單照樣顯示「已給予」。
# %player_name% 要靠 PlaceholderAPI 的 Player 擴充（2026-10-27 才裝），擴充不見時會原封不動送進指令而失敗。
# 所以作用在按的人身上的按鈕用 [player]（能開這個選單的都是 OP），要給別人就用 %panelkey_target%。

open_command:
  - toolbox
  - tb

size: 45
menu_title: '&8&l行動工具箱　&7給：&f%panelkey_target_label%'

open_requirement:
  requirements:
    perm:
      type: has permission
      permission: serverpanel.toolbox

items:

  # ---------- 第一排：指令方塊系列 ----------
  'command_block':
    material: COMMAND_BLOCK
    slot: 0
    display_name: '&b&l指令方塊'
    lore:
      - '&7觸發一次執行一次'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:command_block'
      - '[message] &b已給予指令方塊'

  'chain_command_block':
    material: CHAIN_COMMAND_BLOCK
    slot: 1
    display_name: '&b&l連鎖型指令方塊'
    lore:
      - '&7接在前一個之後依序執行'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:chain_command_block'
      - '[message] &b已給予連鎖型指令方塊'

  'repeating_command_block':
    material: REPEATING_COMMAND_BLOCK
    slot: 2
    display_name: '&b&l循環型指令方塊'
    lore:
      - '&7每 tick 執行一次'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:repeating_command_block'
      - '[message] &b已給予循環型指令方塊'

  'command_minecart':
    material: COMMAND_BLOCK_MINECART
    slot: 3
    display_name: '&b&l指令方塊礦車'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:command_block_minecart'
      - '[message] &b已給予指令方塊礦車'

  'structure_block':
