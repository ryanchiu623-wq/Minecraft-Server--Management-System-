# 關閉伺服器的二次確認
# 只能從管理面板點進來，沒有開啟指令

open_command: []
size: 27
menu_title: '&4&l確定要關閉伺服器嗎？'

open_requirement:
  requirements:
    perm:
      type: has permission
      permission: serverpanel.admin

items:

  'warning':
    material: BARRIER
    slot: 4
    display_name: '&c&l所有玩家都會被斷線'
    lore:
      - '&7遊戲裡會先倒數 5 分鐘（5／3／1 分鐘和最後 30 秒廣播），'
      - '&7時間到才存檔關機，不會掉進度'
      - '&7倒數中可以在管理面板按「取消倒數」'
      - '&7關機後要重開得回到電腦前，或用 Discord 的 &f/start'

  'confirm':
    material: RED_CONCRETE
    slot: 11
    display_name: '&4&l確定關閉（倒數 5 分鐘）'
    lore:
      - '&7開始 5 分鐘倒數，時間到存檔關機'
      - '&7沒有其他真人在線上時一樣會倒數（你也在線上）'
    left_click_commands:
      # PanelKey runs the toolkit's restart-sequence.py: same countdown and
      # cancel as the web console and the Discord bot. Never a bare "stop".
      - '[close]'
      - '[player] serverctl stop'

  'cancel':
    material: LIME_CONCRETE
    slot: 15
    display_name: '&a&l取消'
    lore:
      - '&7返回管理面板'
    left_click_commands:
      - '[openguimenu] admin_panel'
