    slot: 28
    display_name: '&6&l無限抗火藥水'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:potion[potion_contents={custom_effects:[{id:"minecraft:fire_resistance",duration:-1,amplifier:0}]}]'
      - '[message] &6已給予無限抗火藥水'

  'inf_water_breathing':
    material: POTION
    slot: 29
    display_name: '&b&l無限水下呼吸藥水'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:potion[potion_contents={custom_effects:[{id:"minecraft:water_breathing",duration:-1,amplifier:0}]}]'
      - '[message] &b已給予無限水下呼吸藥水'

  'inf_strength':
