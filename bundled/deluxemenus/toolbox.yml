    slot: 30
    display_name: '&c&l無限力量藥水 III'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:potion[potion_contents={custom_effects:[{id:"minecraft:strength",duration:-1,amplifier:2}]}]'
