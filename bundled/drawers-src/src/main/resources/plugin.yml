name: RyanDrawers
version: 1.0.0
main: tw.ryanchiu.drawers.RyanDrawers
api-version: '1.21'
author: ryanchiu623
description: Storage Drawers-style drawers built on barrels.
commands:
  drawers:
    description: 用材料換單格抽屜；管理員另有 give、place、info
    usage: /drawers <buy|give|place|info>
permissions:
  drawers.buy:
    description: /drawers buy
    default: true
  drawers.admin:
    description: /drawers give、place、info
    default: op
