# PanelKey
#
# The server cannot bind client keys. It can only react to actions the
# vanilla client already reports - swapping hands is one of them, so
# "sneak + swap hands" (Shift+F by default) becomes a workable shortcut.

# Run from the console when the shortcut fires. %player% becomes the player's
# name. It goes through the console because DeluxeMenus registers its open
# commands dynamically and Player#performCommand cannot resolve them - that
# path was tried first and failed every time.
console-command: "dm open admin_panel %player%"

# Players with this permission get console-command when the shortcut fires.
# Leave empty to give everyone console-command.
permission: serverpanel.admin

# Everyone else gets this instead - the player menu (home, tpa, back...).
# Set it to "" to keep plain offhand swapping for players without the
# permission above.
player-console-command: "dm open player_menu %player%"

# /serverctl stop|restart runs this, plus --stop / --by / --reason, so planned
# stops get the toolkit's 5-minute in-game countdown. Leave it empty to turn
# /serverctl off. Example:
#   sequence-command:
#     - "C:/Users/you/AppData/Local/Programs/Python/Python313/pythonw.exe"
#     - "C:/mc-toolkit/scripts/restart-sequence.py"
sequence-command: []

# true = /stop and /restart typed in game start the same 5-minute countdown
# as /serverctl instead of shutting down at once. The console and RCON keep
# the immediate stop. Needs sequence-command above.
guard-stop: true

# QualityArmory's gun resource pack, for admins only. Players with
# gun-pack-permission (OPs, unless LuckPerms says otherwise) are offered the
# pack at gun-pack-url this many seconds after joining; everyone else is
# refused /qa getResourcepack and /qa sendResourcepack. Set sendOnJoin: false
# in QualityArmory's config.yml, or it still offers the pack to everyone.
# Use the URL from QualityArmory's DefaultResourcepack list for your version.
# Leave gun-pack-url empty to turn this off.
gun-pack-url: ""
gun-pack-permission: serverpanel.gunpack
gun-pack-delay-seconds: 5

# true  = Shift+F (sneak + swap hands)
# false = F alone, which costs you normal offhand swapping
require-sneak: true

# Log every swap-hands event and its outcome to the server log.
debug: false
