    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:elytra[unbreakable={}]'
      - '[message] &f已給予不壞鞘翅'

  'knockback_stick':
    material: STICK
    slot: 22
    display_name: '&e&l擊退棒'
    lore:
      - '&7擊退 255，一打就飛出視線'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:stick[enchantments={"minecraft:knockback":255}]'
      - '[message] &e已給予擊退棒'

  'speed_boots':
    material: LEATHER_BOOTS
    slot: 23
    display_name: '&a&l極速靴'
    lore:
      - '&7穿上就大幅加速'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:leather_boots[attribute_modifiers=[{type:"minecraft:movement_speed",amount:0.3,operation:"add_value",slot:"feet",id:"minecraft:speed_boots"}],unbreakable={}]'
      - '[message] &a已給予極速靴'

  'jade_sword':
    material: NETHERITE_SWORD
    slot: 24
    display_name: '&b&l玉髓劍'
    lore:
      - '&3鋒利 · 橫掃 · 掠奪 · 火焰　全 255'
      - '&3攻速無冷卻，永不損壞'
      - '&c一擊必殺：攻擊力 +2048（遊戲上限）'
      - '&8無擊退：怪物原地倒下，掉落物不噴飛'
    left_click_commands:
      # attribute_modifiers replaces the sword's own +7 damage, so the damage
      # modifier has to be listed here too. 2048 is the attribute's cap.
      - '[console] minecraft:give %panelkey_target% minecraft:netherite_sword[custom_name={text:"玉髓劍",color:"aqua",bold:true,italic:false},lore=[{text:"以玉髓之心鍛成",color:"dark_aqua",italic:false},{text:"一擊，萬物俱寂",color:"gray",italic:false}],enchantments={"minecraft:sharpness":255,"minecraft:sweeping_edge":255,"minecraft:looting":255,"minecraft:fire_aspect":255},attribute_modifiers=[{type:"minecraft:attack_speed",amount:4,operation:"add_value",slot:"mainhand",id:"minecraft:jade_speed"},{type:"minecraft:attack_damage",amount:2048,operation:"add_value",slot:"mainhand",id:"minecraft:jade_damage"}],unbreakable={},rarity="epic"]'
      - '[message] &b已給予玉髓劍'

