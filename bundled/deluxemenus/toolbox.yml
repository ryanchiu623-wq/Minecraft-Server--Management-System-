    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:potion[potion_contents={custom_effects:[{id:"minecraft:night_vision",duration:-1,amplifier:0}]}]'
      - '[message] &e已給予無限夜視藥水'

  'inf_fire_resist':
