    slot: 5
    display_name: '&e&l結構方塊'
    lore:
      - '&7儲存與貼上建築'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:structure_block'
      - '[message] &e已給予結構方塊'

  'jigsaw':
    material: JIGSAW
    slot: 6
    display_name: '&e&l拼圖方塊'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:jigsaw'
      - '[message] &e已給予拼圖方塊'

  'structure_void':
    material: STRUCTURE_VOID
    slot: 7
    display_name: '&e&l結構空位'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:structure_void 16'
      - '[message] &e已給予結構空位 x16'

  'light':
    material: LIGHT
    slot: 8
    display_name: '&f&l光源方塊'
    lore:
      - '&7隱形光源，亮度 0-15'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:light 16'
      - '[message] &f已給予光源方塊 x16'

  # ---------- 第二排：其他操作員物品 ----------
  'debug_stick':
    material: DEBUG_STICK
    slot: 9
    display_name: '&d&l除錯棒'
    lore:
      - '&7左鍵切屬性，右鍵改數值'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:debug_stick'
      - '[message] &d已給予除錯棒'

  'barrier':
    material: BARRIER
    slot: 10
    display_name: '&c&l屏障'
    lore:
      - '&7隱形但無法穿越'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:barrier 64'
      - '[message] &c已給予屏障 x64'

  'bedrock':
    material: BEDROCK
    slot: 11
    display_name: '&8&l基岩'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:bedrock 64'
      - '[message] &7已給予基岩 x64'

  'spawner':
    material: SPAWNER
    slot: 12
    display_name: '&2&l生怪磚'
    lore:
      - '&7預設是豬，用除錯棒改'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:spawner'
      - '[message] &2已給予生怪磚'

  'end_portal_frame':
    material: END_PORTAL_FRAME
    slot: 13
