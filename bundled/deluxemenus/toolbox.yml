    slot: 16
    display_name: '&6&l行動工作站'
    lore:
      - '&7工作台、終界箱、鐵砧、附魔台等'
      - '&7不用放方塊就能開'
    left_click_commands:
      - '[openguimenu] stations'

  'drawers':
    material: BARREL
    slot: 17
    display_name: '&e&l中藥櫃'
    lore:
      - '&7三種抽屜和五種容量升級'
      - '&7免費拿，給「選擇要給誰」選的人'
    left_click_commands:
      - '[openguimenu] drawers'

  # ---------- 第三排：超過上限的附魔（創造做不到） ----------
  'super_pickaxe':
    material: NETHERITE_PICKAXE
    slot: 18
    display_name: '&d&l效率 255 不壞鎬'
    lore:
      - '&7瞬間破壞任何方塊'
      - '&c挖基岩也可以，小心'
    left_click_commands:
      - '[console] minecraft:give %panelkey_target% minecraft:netherite_pickaxe[enchantments={"minecraft:efficiency":255},unbreakable={}]'
      - '[message] &d已給予超級鎬'

  'super_sword':
