    slot: 31
    display_name: '&b&l選擇要給誰'
    lore:
      - '&7目前：&f%panelkey_target_label%'
      - '&7點擊列出線上玩家'
    left_click_commands:
      - '[player] givetarget'

  'back':
    material: ARROW
    slot: 35
    display_name: '&7&l返回工具箱'
    left_click_commands:
      - '[openguimenu] toolbox'
